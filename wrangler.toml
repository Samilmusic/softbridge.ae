name = "bridge-to-success-web"
main = "dist/server/index.mjs"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Nitro's cloudflare-module preset emits the Worker to dist/server and
# static client assets to dist/client.
[assets]
directory = "./dist/client"
binding = "ASSETS"
